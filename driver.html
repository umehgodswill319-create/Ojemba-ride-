<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ọje Mba - Driver Dispatch Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5UguBfFrYOZ5_FTY_CkJ5CbW13R7u0Us",
            authDomain: "oje-mba.firebaseapp.com",
            projectId: "oje-mba",
            storageBucket: "oje-mba.firebasestorage.app",
            messagingSenderId: "533103428826",
            appId: "1:533103428826:web:b8c16aa8f9ac92204a51e3",
            measurementId: "G-ZQ72WX97WE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let webcamStream = null;
        window.capturedFaceData = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedDriver = localStorage.getItem('oje_driver');
            if (savedDriver) {
                const driverData = JSON.parse(savedDriver);
                openHub(driverData);
            } else {
                listenToLiveFeed();
            }
        });

        // 1. LIVE FEED: Only show PENDING rides
        function listenToLiveFeed() {
            const q = query(
                collection(db, "rides"),
                where("status", "==", "pending"),
                orderBy("createdAt", "desc")
            );

            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('ridesContainer');
                if(!container) return;
                container.innerHTML = "";
                
                if (snapshot.empty) {
                    container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:13px;">No available ride requests right now.</p>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const ride = docSnap.data();
                    const rideId = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "card";
                    card.style.marginBottom = "15px";
                    card.style.marginTop = "0";
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <span style="color:var(--primary); font-weight:700; font-size:12px;">${ride.serviceType || 'Ọje Mba Ride'}</span>
                            <span style="font-size:11px; font-weight:700; color:#f39c12;">PENDING</span>
                        </div>
                        <p style="margin:3px 0; font-size:13px;"><strong>Passenger:</strong> ${ride.passengerName || 'Anonymous'}</p>
                        <p style="margin:3px 0; font-size:13px;"><strong>Phone:</strong> <a href="tel:${ride.passengerPhone}" style="color:var(--primary);">${ride.passengerPhone || 'N/A'}</a></p>
                        <p style="margin:3px 0; font-size:13px;"><strong>State:</strong> ${ride.state}</p>
                        <p style="margin:3px 0; font-size:13px;"><strong>From:</strong> ${ride.pickup}</p>
                        <p style="margin:3px 0; font-size:13px;"><strong>To:</strong> ${ride.dropoff}</p>
                        <p style="margin:3px 0; font-size:14px; color:var(--primary);"><strong>Fare:</strong> ₦${Number(ride.proposedFare || 0).toLocaleString()}</p>
                        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.08); margin:12px 0;">
                        <button class="primary-btn" style="margin-top:0;" onclick="acceptRide('${rideId}')">Accept Ride &amp; Dispatch</button>
                    `;
                    container.appendChild(card);
                });
            }, (error) => {
                console.error("Error listening to rides feed:", error);
            });
        }

        // 2. SECURE DRIVER HISTORY (MY RIDES)
        window.loadDriverHistory = function(driverPhone) {
            if (!driverPhone) return;

            const q = query(
                collection(db, "rides"),
                where("driverPhone", "==", driverPhone),
                orderBy("createdAt", "desc")
            );

            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('driverHistoryContainer');
                if (!container) return;
                container.innerHTML = "";
                
                if (snapshot.empty) {
                    container.innerHTML = `
                        <p style="text-align:center; color:var(--text-muted); font-size:13px; line-height:1.6;">
                            No active or accepted rides yet.<br>Rides you accept will appear here!
                        </p>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const ride = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "card";
                    card.style.marginBottom = "15px";
                    card.style.marginTop = "0";
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <span style="color:var(--primary); font-weight:700; font-size:12px;">${ride.serviceType}</span>
                            <span style="font-weight:700; font-size:11px; color:#2ecc71;">ACCEPTED / IN PROGRESS</span>
                        </div>
                        <p style="margin:3px 0; font-size:13px;"><strong>Passenger:</strong> ${ride.passengerName} (<a href="tel:${ride.passengerPhone}" style="color:var(--primary);">${ride.passengerPhone}</a>)</p>
                        <p style="margin:3px 0; font-size:13px;"><strong>From:</strong> ${ride.pickup}</p>
                        <p style="margin:3px 0; font-size:13px;"><strong>To:</strong> ${ride.dropoff}</p>
                        <p style="margin:3px 0; font-size:13px; color:var(--primary);"><strong>Fare:</strong> ₦${Number(ride.proposedFare).toLocaleString()}</p>
                    `;
                    container.appendChild(card);
                });
            }, (error) => {
                console.error("Firestore history error:", error);
            });
        };

        window.acceptRide = async function(rideId) {
            const driverData = JSON.parse(localStorage.getItem('oje_driver'));
            if (!driverData) {
                alert("Driver profile missing. Please register first.");
                return;
            }

            try {
                const rideRef = doc(db, "rides", rideId);
                await updateDoc(rideRef, {
                    status: "accepted",
                    driverName: driverData.name,
                    driverPhone: driverData.phone,
                    driverPlate: driverData.plate,
                    driverVehicle: driverData.vehicle
                });
                alert("Ride accepted successfully!");
                switchTab('history');
            } catch (error) {
                console.error("Firebase update failed: ", error);
                alert("Failed to accept ride. Check your connection.");
            }
        };

        // FACE VERIFICATION HANDLERS
        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    window.capturedFaceData = e.target.result;
                    const preview = document.getElementById('facePreview');
                    preview.src = window.capturedFaceData;
                    preview.style.display = 'block';
                    document.getElementById('faceVerifiedBadge').style.display = 'inline-block';
                };
                reader.readAsDataURL(file);
            }
        };

        window.startCamera = async function() {
            const video = document.getElementById('webcamVideo');
            const cameraBox = document.getElementById('cameraBox');
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                video.srcObject = webcamStream;
                cameraBox.style.display = 'block';
            } catch (err) {
                alert("Camera permissions blocked. Please use the 'Upload Photo' button instead.");
            }
        };

        window.capturePhoto = function() {
            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('faceCanvas');
            const preview = document.getElementById('facePreview');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 225;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            window.capturedFaceData = canvas.toDataURL('image/jpeg', 0.8);
            preview.src = window.capturedFaceData;
            preview.style.display = 'block';

            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraBox').style.display = 'none';
            document.getElementById('faceVerifiedBadge').style.display = 'inline-block';
        };

        window.registerDriverProfile = async function() {
            const name = document.getElementById('driverName').value.trim();
            const phone = document.getElementById('driverPhone').value.trim();
            const plate = document.getElementById('driverPlate').value.trim().toUpperCase();
            const vehicle = document.getElementById('driverVehicle').value.trim();
            const idNumber = document.getElementById('driverIdNumber').value.trim();
            const facePhoto = window.capturedFaceData;

            if (!name || !phone || !plate || !vehicle || !idNumber) {
                alert("Please fill in all required contact, vehicle, and driver's license details.");
                return;
            }

            if (!facePhoto && !localStorage.getItem('oje_driver')) {
                alert("Please complete the Face Verification photo step before saving.");
                return;
            }

            try {
                const driverData = {
                    name,
                    phone,
                    plate,
                    vehicle,
                    idType: "Driver License",
                    idNumber,
                    faceVerified: true,
                    facePhoto: facePhoto || ''
                };

                localStorage.setItem('oje_driver', JSON.stringify(driverData));
                await setDoc(doc(db, "drivers", phone), driverData, { merge: true });

                alert("Profile verified & saved successfully!");
                openHub(driverData);
            } catch (e) {
                console.error("Error saving driver: ", e);
                alert("Registration failed. Check connection.");
            }
        };

        function openHub(driver) {
            document.getElementById('driverRegSection').style.display = 'none';
            document.getElementById('ridesSection').style.display = 'block';
            document.getElementById('driverInfoBadge').innerText = `${driver.name} | Plate: ${driver.plate}`;
            listenToLiveFeed();
            loadDriverHistory(driver.phone);
        }

        window.switchTab = function(tabName) {
            document.getElementById('feedTabContent').style.display = tabName === 'feed' ? 'block' : 'none';
            document.getElementById('historyTabContent').style.display = tabName === 'history' ? 'block' : 'none';
            document.getElementById('profileTabContent').style.display = tabName === 'profile' ? 'block' : 'none';
            
            document.getElementById('btnFeedTab').className = tabName === 'feed' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('btnHistoryTab').className = tabName === 'history' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('btnProfileTab').className = tabName === 'profile' ? 'tab-btn active' : 'tab-btn';

            if (tabName === 'history') {
                const d = JSON.parse(localStorage.getItem('oje_driver'));
                if (d) loadDriverHistory(d.phone);
            } else if (tabName === 'profile') {
                const d = JSON.parse(localStorage.getItem('oje_driver'));
                if (d) {
                    document.getElementById('profileDetails').innerHTML = `
                        ${d.facePhoto ? `<div style="text-align:center; margin-bottom:12px;"><img src="${d.facePhoto}" style="width:90px; height:90px; border-radius:50%; border:2px solid var(--primary); object-fit:cover;"></div>` : ''}
                        <p style="margin:8px 0; font-size:14px;"><strong>Full Name:</strong> ${d.name}</p>
                        <p style="margin:8px 0; font-size:14px;"><strong>Phone Number:</strong> ${d.phone}</p>
                        <p style="margin:8px 0; font-size:14px;"><strong>Vehicle Model &amp; Color:</strong> ${d.vehicle}</p>
                        <p style="margin:8px 0; font-size:14px; color:var(--primary);"><strong>License Plate Number:</strong> ${d.plate}</p>
                        <p style="margin:8px 0; font-size:14px;"><strong>Driver's License No:</strong> ${d.idNumber || 'Verified'}</p>
                        <p style="margin:8px 0; font-size:14px; color:#2ecc71;"><strong>Face Biometrics:</strong> Verified ✓</p>
                        <button class="primary-btn" style="margin-top:15px; background:rgba(16,185,129,0.1); color:var(--primary); border:1px solid var(--border);" onclick="populateEditForm()">Edit Credentials</button>
                    `;
                }
            }
        };

        window.populateEditForm = function() {
            const d = JSON.parse(localStorage.getItem('oje_driver'));
            if(d) {
                document.getElementById('driverName').value = d.name;
                document.getElementById('driverPhone').value = d.phone;
                document.getElementById('driverVehicle').value = d.vehicle;
                document.getElementById('driverPlate').value = d.plate;
                if(d.idNumber) document.getElementById('driverIdNumber').value = d.idNumber;
                if(d.facePhoto) {
                    window.capturedFaceData = d.facePhoto;
                    document.getElementById('facePreview').src = d.facePhoto;
                    document.getElementById('facePreview').style.display = 'block';
                    document.getElementById('faceVerifiedBadge').style.display = 'inline-block';
                }
            }
            document.getElementById('ridesSection').style.display = 'none';
            document.getElementById('driverRegSection').style.display = 'block';
            document.getElementById('driverRegTitle').innerText = "Update Driver Credentials";
        };

        window.logoutDriver = function() {
            localStorage.removeItem('oje_driver');
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('ridesSection').style.display = 'none';
            document.getElementById('driverRegSection').style.display = 'block';
            document.getElementById('driverRegTitle').innerText = "Driver Registration";
            document.getElementById('driverName').value = '';
            document.getElementById('driverPhone').value = '';
            document.getElementById('driverVehicle').value = '';
            document.getElementById('driverPlate').value = '';
            document.getElementById('driverIdNumber').value = '';
            document.getElementById('facePreview').style.display = 'none';
            document.getElementById('faceVerifiedBadge').style.display = 'none';
            window.capturedFaceData = null;
        };
    </script>

    <style>
        :root {
            --bg-deep: #020617;
            --surface: rgba(15, 23, 42, 0.75);
            --border: rgba(16, 185, 129, 0.25);
            --primary: #10b981;
            --accent-gold: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 100%); background-attachment: fixed; color: var(--text-main); margin: 0; padding: 20px; min-height: 100vh; }
        .content { max-width: 420px; margin: auto; }
        .card { background: var(--surface); backdrop-filter: blur(16px); border: 1px solid var(--border); padding: 24px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-top: 10px; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 2px; font-size: 28px; }
        p.subtitle { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 0; margin-bottom: 20px; text-transform: uppercase; }
        label { display: block; margin-top: 15px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        input, select { width: 100%; padding: 12px 14px; margin-top: 6px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(2, 6, 23, 0.8); color: var(--text-main); box-sizing: border-box; font-size: 14px; outline: none; }
        button.primary-btn { width: 100%; background: linear-gradient(135deg, #10b981 0%, #0284c7 100%); color: #ffffff; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; margin-top: 20px; cursor: pointer; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3); }
        .crazy-font { font-family: Permanent Marker, cursive, sans-serif; letter-spacing: 1px; transform: rotate(-2deg); display: inline-block; }
        .tab-btn { flex: 1; padding: 10px 4px; background: rgba(2, 6, 23, 0.8); color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: var(--primary); color: #020617; border-color: var(--primary); font-weight: 700; }
        .verify-badge { display: inline-block; background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc71; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="content">
        <h2 class="crazy-font" style="width:100%; text-align:center;">Ọje Mba</h2>
        <p class="subtitle">Driver &amp; Dispatch Security Hub</p>

        <!-- Driver Registration Form -->
        <div id="driverRegSection" class="card">
            <h3 id="driverRegTitle" style="color:var(--primary); margin-top:0; font-size:20px; text-align:center;">Driver Verification &amp; Registration</h3>
            <p style="font-size:12px; color:var(--text-muted); text-align:center;">Complete security verification to enter the dispatch hub.</p>

            <label>Full Name:</label>
            <input type="text" id="driverName" placeholder="e.g., Emeka Johnson">

            <label>Phone Number:</label>
            <input type="tel" id="driverPhone" placeholder="e.g., 08088888888">

            <label>Vehicle Model &amp; Color:</label>
            <input type="text" id="driverVehicle" placeholder="e.g., Lexus 350 (Black)">

            <label>License Plate Number:</label>
            <input type="text" id="driverPlate" placeholder="e.g., ABC-450KYC" style="text-transform:uppercase;">

            <label>Driver's License Number:</label>
            <input type="text" id="driverIdNumber" placeholder="e.g., ABC12345678A">

            <!-- Face Verification Section -->
            <label>Face Biometric Verification:</label>
            <div style="margin-top:8px; text-align:center; display:flex; gap:8px;">
                <input type="file" id="cameraFileInput" accept="image/*" capture="user" style="display:none;" onchange="handleImageUpload(event)">
                <button type="button" onclick="document.getElementById('cameraFileInput').click()" style="flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#fff; padding:10px 6px; border-radius:10px; font-size:12px; cursor:pointer;">
                    📁 Upload Photo
                </button>
                <button type="button" onclick="startCamera()" style="flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#fff; padding:10px 6px; border-radius:10px; font-size:12px; cursor:pointer;">
                    📷 Snap Live
                </button>
            </div>

            <div id="cameraBox" style="display:none; margin-top:12px; background:#000; border-radius:12px; padding:10px; border:1px solid var(--border);">
                <video id="webcamVideo" autoplay playsinline style="width:100%; height:auto; border-radius:8px;"></video>
                <button type="button" onclick="capturePhoto()" class="primary-btn" style="margin-top:8px; padding:10px; font-size:13px;">Capture Photo</button>
            </div>

            <canvas id="faceCanvas" style="display:none;"></canvas>
            <div style="text-align:center;">
                <img id="facePreview" style="display:none; margin:12px auto 0 auto; width:100px; height:100px; border-radius:50%; border:2px solid var(--primary); object-fit:cover;" />
                <span id="faceVerifiedBadge" class="verify-badge" style="display:none;">Face Captured ✓</span>
            </div>

            <button class="primary-btn" onclick="registerDriverProfile()">Save &amp; Verify Profile</button>
        </div>

        <!-- Live Rides Feed & Profile Hub -->
        <div id="ridesSection" style="display:none;">
            <div class="card" style="margin-bottom:15px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span style="font-size:11px; color:var(--text-muted); display:block;">Logged Driver:</span>
                    <span id="driverInfoBadge" style="font-size:13px; font-weight:bold; color:var(--primary);">---</span>
                </div>
                <button onclick="logoutDriver()" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:var(--text-muted); padding:6px 10px; border-radius:6px; font-size:11px; cursor:pointer;">Log Out</button>
            </div>

            <!-- Navigation Tabs -->
            <div style="display:flex; gap:6px; margin-bottom:15px;">
                <button id="btnFeedTab" class="tab-btn active" onclick="switchTab('feed')">📡 Live Feed</button>
                <button id="btnHistoryTab" class="tab-btn" onclick="switchTab('history')">🕒 My Rides</button>
                <button id="btnProfileTab" class="tab-btn" onclick="switchTab('profile')">👤 Profile</button>
            </div>

            <!-- Tab 1: Feed -->
            <div id="feedTabContent">
                <div id="ridesContainer">
                    <p style="text-align:center; color:var(--text-muted); font-size:13px;">Listening for ride requests...</p>
                </div>
            </div>

            <!-- Tab 2: Secure Driver History -->
            <div id="historyTabContent" style="display:none;">
                <div class="card" style="margin-top:0;">
                    <h3 style="margin-top:0; color:var(--primary); font-size:18px; text-align:center;">My Accepted Rides</h3>
                    <div id="driverHistoryContainer">
                        <p style="text-align:center; color:var(--text-muted); font-size:13px;">Loading your history...</p>
                    </div>
                </div>
            </div>

            <!-- Tab 3: Profile -->
            <div id="profileTabContent" style="display:none;">
                <div class="card" style="margin-top:0;">
                    <h3 style="margin-top:0; color:var(--primary); font-size:18px; text-align:center;">Driver Credentials</h3>
                    <div id="profileDetails"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
